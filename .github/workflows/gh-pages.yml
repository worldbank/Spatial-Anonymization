name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages source is set to "GitHub Actions" in the repo settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Notebooks are rendered from saved outputs (execute_notebooks: off),
      # so the package and its geospatial dependencies are not installed here.
      - name: Dependencies
        run: pip install -r docs/requirements.txt
      - name: Build
        run: jupyter-book build . --config docs/_config.yml --toc docs/_toc.yml --warningiserror --keep-going
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
