name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Notebooks are rendered from saved outputs (execute_notebooks: off),
      # so the package and its geospatial dependencies are not installed here.
      - name: Dependencies
        run: pip install -r docs/requirements.txt
      - name: Build
        run: jupyter-book build . --config docs/_config.yml --toc docs/_toc.yml --warningiserror --keep-going
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && job.status == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          enable_jekyll: false
