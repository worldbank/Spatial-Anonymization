# Book settings
title: Spatial Anonymization
author: World Bank Development Data Group
copyright: "2026"
only_build_toc_files: true
exclude_patterns: [".github/*", "_build", "src", "tests", "data", ".venv"]

repository:
  url: https://github.com/worldbank/Spatial-Anonymization
  branch: main

#######################################################################################
# HTML-specific settings
html:
  home_page_in_navbar: false
  extra_navbar: ""
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  baseurl: https://worldbank.github.io/Spatial-Anonymization

#######################################################################################
# Execution settings
# Notebooks are NOT re-executed on build: they need confidential survey data and
# local geospatial files that are not in the repo. The saved outputs are rendered.
execute:
  execute_notebooks: "off"

#######################################################################################
# Sphinx settings
sphinx:
  config:
    html_last_updated_fmt: "%b %d, %Y"
