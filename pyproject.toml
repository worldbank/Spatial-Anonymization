[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-anonymization"
version = "1.0.0"
description = "A Python package for anonymizing GPS coordinates from household surveys"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md", content-type = "text/markdown"}
keywords = ["Spatial Anonymization", "DECAT, World Bank", "Household surveys"]
authors = [
  {name="World Bank Development Data Group, GOST team", email="gostb@worldbank.org"},
]
maintainers = [
  {name="Dunstan Matekenya", email="dmatekenya@worldbankgroup.org"},
]
classifiers = [
    "Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.7",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3 :: Only",
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
"boto3>=1.24.28",
"botocore>=1.27.59",
"geopandas>=0.9.0",
"numpy>=1.23.5",
"pandana>=0.6.1",
"pandas>=1.5.3",
"pyproj>=3.1.0",
"rasterio>=1.2.10",
"requests>=2.28.1",
"scikit_image>=0.19.3",
"scipy>=1.10.0",
"Shapely>=1.8.4"]

[project.optional-dependencies]
notebook = ["notebook>=6.5.2"]

[project.urls]
"Homepage" = "https://github.com/worldbank/Spatial-Anonymization"
"Bug Reports" = "https://github.com/worldbank/Spatial-Anonymization"
"Source" = "https://github.com/worldbank/Spatial-Anonymization"

[tool.setuptools.dynamic]
# version = {attr = "spatial-anonymization.__version__"}