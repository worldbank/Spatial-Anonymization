[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-anonymization"
version = "1.0.0"
description = "A Python package for anonymizing GPS coordinates from household surveys"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md", content-type = "text/markdown"}
keywords = ["Spatial Anonymization", "DECAT, World Bank", "Household surveys"]
authors = [
  {name="World Bank Development Data Group, GOST team", email="gostb@worldbank.org"},
]
maintainers = [
  {name="Dunstan Matekenya", email="dmatekenya@worldbankgroup.org"},
]
classifiers = [
    "Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3 :: Only",
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.24.28",
    "botocore>=1.27.59",
    "geopandas>=0.14.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "chardet>=5.0.0",
    "requests>=2.31.0",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "shapely>=2.0.0",
    "pytest>=9.0.2",
    "rasterstats>=0.20.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "folium>=0.20.0",
]

[project.optional-dependencies]
notebook = ["notebook>=7.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/worldbank/Spatial-Anonymization"
"Bug Reports" = "https://github.com/worldbank/Spatial-Anonymization"
"Source" = "https://github.com/worldbank/Spatial-Anonymization"

[tool.setuptools.dynamic]
# version = {attr = "spatial-anonymization.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services/internet",
    "download: marks tests that download data from external sources",
]
